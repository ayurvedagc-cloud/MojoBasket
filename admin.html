<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f1d1b">
<title>Panel SuperAdmin · MojoBasket</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4e7cf;--card:#fffcf5;--ink:#1f1d1b;--muted:#5e5547;--line:#e3d4b8;--accent:#ffc72c;--accent-soft:#fff1c7;--atl:#0a5e8c;--atl-soft:#dcebf4;--leaf:#3f6a2b;--leaf-soft:#e2ecd9;--chili:#a9442a;--chili-soft:#f6e1d9;--r:18px;--shadow:0 1px 2px rgba(31,29,27,.05),0 6px 20px rgba(31,29,27,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--atl)}
.serif{font-family:"Fraunces",Georgia,serif}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.hrow{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.hrow h1{font-family:"Fraunces",Georgia,serif;font-size:20px;margin:0;flex:1;font-weight:600}
.hrow h1 small{font-family:"Hanken Grotesk",sans-serif;font-size:12px;font-weight:600;color:#d9cdb5;margin-left:6px}
.hrow .who{font-size:12px;color:#d9cdb5;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow a.app{color:#fff;font-size:13px;font-weight:700;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:10px;text-decoration:none}
nav{display:flex;gap:4px;overflow-x:auto;max-width:1100px;margin:8px auto 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;padding:9px 13px 11px;font-weight:700;font-size:14px;color:#d9cdb5;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
h2{font-family:"Fraunces",Georgia,serif;font-size:22px;margin:4px 0 12px;font-weight:600}
h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;color:var(--muted);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:40px;padding:0 14px;border-radius:12px;background:var(--atl-soft);color:var(--atl);font-weight:700;white-space:nowrap}
.btn.p{background:var(--accent);color:var(--ink)}
.btn.r{background:var(--chili-soft);color:var(--chili)}
.btn.g{background:var(--leaf-soft);color:var(--leaf)}
.btn:disabled{opacity:.5;cursor:default}
.inp{height:40px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;min-width:0}
textarea.inp{height:auto;min-height:80px;padding:10px 12px;width:100%;resize:vertical}
.grow{flex:1}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 7px;line-height:1.5;vertical-align:1px}
.pill.pro{background:var(--accent-soft);color:#7a5a00}.pill.gratis{background:var(--line);color:var(--ink)}
.pill.adm{background:var(--ink);color:#fff}.pill.blq{background:var(--chili);color:#fff}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)}.pill.warn{background:var(--accent-soft);color:#7a5a00}.pill.bad{background:var(--chili-soft);color:var(--chili)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .tx{flex:1;min-width:0}.list .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .tx small{display:block;color:var(--muted);font-size:12.5px}
.list li.click{cursor:pointer}.list li.click:hover{background:rgba(10,94,140,.04)}
.muted{color:var(--muted)}.small{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1.5px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
/* gráfico de barras */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.chart .tip.on{opacity:1}
.chart .cap{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:4px}
dialog{border:0;border-radius:22px;padding:0;width:min(640px,calc(100vw - 20px));max-height:calc(100vh - 30px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(31,29,27,.35)}
dialog::backdrop{background:rgba(31,29,27,.5)}
dialog .in{padding:18px 18px 20px}
dialog .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:11px;background:var(--bg);font-size:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.zona{border:1.5px dashed var(--chili);border-radius:14px;padding:12px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;z-index:50;max-width:calc(100vw - 30px);box-shadow:var(--shadow)}
.center{text-align:center;padding:50px 10px}
.check{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.check i{font-style:normal;width:20px;text-align:center}
pre{background:var(--bg);border-radius:12px;padding:10px;overflow:auto;max-height:320px;font-size:12px}
.hidden{display:none!important}
@media (min-width:760px){.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cols>.card{margin:0}}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>MojoBasket<small>SuperAdmin</small></h1><span class="who" id="who"></span><a class="app" href="/">App</a></div>
  <nav id="tabs" class="hidden">
    <button data-tab="resumen" class="on">Resumen</button><button data-tab="usuarios">Usuarios</button><button data-tab="planes">Planes</button><button data-tab="uso">Uso y costes</button>
    <button data-tab="catalogos">Catálogos</button><button data-tab="sistema">Sistema</button><button data-tab="auditoria">Auditoría</button>
  </nav>
</header>
<main id="main"><div class="center muted">Cargando…</div></main>
<dialog id="dlg"></dialog>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=new Intl.NumberFormat("es-ES"), usd=(x)=>"$"+(x||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2});
const fecha=(s)=>s?new Date(s).toLocaleString("es-ES",{timeZone:"Atlantic/Canary",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const fdia=(s)=>s?new Date(s+"T12:00:00Z").toLocaleDateString("es-ES",{day:"numeric",month:"short"}):"";
const hace=(s)=>{ if(!s) return "nunca"; const m=(Date.now()-new Date(s))/6e4; return m<1?"ahora":m<60?`hace ${Math.round(m)} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} d`; };
const bytes=(n)=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":n<1073741824?(n/1048576).toFixed(1)+" MB":(n/1073741824).toFixed(2)+" GB";
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }

async function api(accion,params={},body){
  const q=new URLSearchParams({accion,...params});
  const r=await fetch("/api/admin?"+q,body?{method:"POST",headers:{"content-type":"application/json","x-mb-admin":"1"},body:JSON.stringify(body)}:{headers:{accept:"application/json"}});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw Object.assign(new Error(j.error||("HTTP "+r.status)),{status:r.status,code:j.code});
  return j;
}
const ST={tab:"resumen",usuarios:null,filtro:{q:"",plan:"",estado:""}};

/* ---------- gráfico de barras (una serie, sin leyenda: el título la nombra) ---------- */
function barras(datos,{alto=150,fmt=(v)=>nf.format(v),etq=(d)=>fdia(d.k)}={}){
  const W=600,H=alto,pad=22,n=datos.length||1,gw=(W)/n,bw=Math.max(3,Math.min(26,gw-2));
  const max=Math.max(1,...datos.map(d=>d.v)), y=(v)=>H-pad-(v/max)*(H-pad-8);
  const ticks=[0,Math.round(max/2),max];
  const g=ticks.map(t=>`<line x1="0" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="#e3d4b8" stroke-width="1"/><text x="0" y="${y(t)-3}" font-size="10" fill="#5e5547">${esc(fmt(t))}</text>`).join("");
  const bars=datos.map((d,i)=>{ const x=i*gw+(gw-bw)/2, yy=y(d.v), h=Math.max(0,H-pad-yy);
    const path=h>0?`M${x},${H-pad} V${yy+Math.min(4,h)} Q${x},${yy} ${x+Math.min(4,bw/2)},${yy} H${x+bw-Math.min(4,bw/2)} Q${x+bw},${yy} ${x+bw},${yy+Math.min(4,h)} V${H-pad} Z`:"";
    return `<g data-i="${i}"><rect x="${i*gw}" y="0" width="${gw}" height="${H}" fill="transparent"/>${path?`<path d="${path}" fill="#0a5e8c"/>`:""}</g>`; }).join("");
  const id="c"+Math.random().toString(36).slice(2,7);
  setTimeout(()=>{ const c=document.getElementById(id); if(!c) return; const tip=c.querySelector(".tip"), svg=c.querySelector("svg");
    const show=(e)=>{ const g=e.target.closest("g[data-i]"); if(!g){ tip.classList.remove("on"); return; } const d=datos[+g.dataset.i], r=svg.getBoundingClientRect(), cr=c.getBoundingClientRect();
      tip.innerHTML=`<b>${esc(etq(d))}</b> · ${esc(fmt(d.v))}${d.extra?`<br>${esc(d.extra)}`:""}`; tip.style.left=((+g.dataset.i+.5)*gw/W*r.width+(r.left-cr.left))+"px"; tip.style.top=(y(d.v)/H*r.height)+"px"; tip.classList.add("on"); };
    svg.addEventListener("pointermove",show); svg.addEventListener("pointerdown",show); svg.addEventListener("pointerleave",()=>tip.classList.remove("on")); },0);
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras">${g}${bars}</svg><div class="tip"></div><div class="cap"><span>${esc(etq(datos[0]||{}))}</span><span>${esc(etq(datos.at(-1)||{}))}</span></div></div>`;
}

/* ---------- pestañas ---------- */
const VISTAS={
async resumen(){
  const j=ST.pre||await api("resumen"); ST.pre=null; const u=j.usuarios, c=j.claude_hoy;
  const act=j.actividad||[], listas=act.map(d=>({k:d.dia,v:d.lista,extra:`${d.clic} clics · ${d.copiar} copias`}));
  return `<h2>Resumen</h2>
  <div class="kpis">
    <div class="kpi"><small>Usuarios</small><b>${nf.format(u.total)}</b><i>${u.nuevos_7d} nuevos en 7 días</i></div>
    <div class="kpi"><small>Activos 7 días</small><b>${nf.format(u.activos_7d)}</b><i>${u.total?Math.round(u.activos_7d/u.total*100):0}% del total</i></div>
    <div class="kpi"><small>Plan Pro</small><b>${nf.format(u.pro)}</b><i>${u.bloqueados} suspendidos</i></div>
    <div class="kpi"><small>Listas en la nube</small><b>${nf.format(u.listas_guardadas)}</b><i>historiales guardados</i></div>
    <div class="kpi"><small>Claude hoy</small><b>${c?nf.format(c.llamadas):"—"}</b><i>${c?`de ${nf.format(c.tope)} (${Math.round(c.llamadas/c.tope*100)}%)`:"sin datos"}</i></div>
    <div class="kpi"><small>Coste Claude hoy</small><b>${c?usd(c.coste_usd):"—"}</b><i>estimado</i></div>
  </div>
  <div class="cols" style="margin-top:12px">
    <div class="card"><h3 style="margin-top:0">Listas generadas · 14 días</h3>${act.length?barras(listas):`<p class="muted">Sin eventos.</p>`}
      <p class="small muted" style="margin:8px 0 0">Total: ${nf.format(act.reduce((a,d)=>a+d.lista,0))} listas · ${nf.format(act.reduce((a,d)=>a+d.clic,0))} clics a supermercados</p></div>
    <div class="card"><h3 style="margin-top:0">Actividad reciente</h3><ul class="list">${(j.recientes||[]).map(r=>`<li class="click" data-uid="${esc(r.uid)}"><div class="tx"><b>${esc(r.email)}</b><small>${hace(r.ultimo||r.creado)}</small></div>${planPill(r)}</li>`).join("")||`<li class="muted">Aún no hay cuentas.</li>`}</ul></div>
  </div>`;
},
async usuarios(){
  const f=ST.filtro, j=await api("usuarios",{q:f.q,plan:f.plan,estado:f.estado}); ST.usuarios=j.usuarios;
  return `<h2>Usuarios <span class="muted small">${nf.format(j.total)}</span></h2>
  <div class="card"><form class="row" id="fBusca"><input class="inp grow" name="q" type="search" placeholder="Buscar por email" value="${esc(f.q)}" autocomplete="off">
    <select class="inp" name="plan"><option value="">Todos los planes</option><option value="pro"${f.plan==="pro"?" selected":""}>Pro</option><option value="gratis"${f.plan==="gratis"?" selected":""}>Gratis</option></select>
    <select class="inp" name="estado"><option value="">Todos</option><option value="activo"${f.estado==="activo"?" selected":""}>Activos</option><option value="bloqueado"${f.estado==="bloqueado"?" selected":""}>Suspendidos</option></select>
    <button class="btn p">Buscar</button><button type="button" class="btn" data-a="nuevo">+ Crear cuenta</button><button type="button" class="btn" data-a="csv">CSV</button></form></div>
  <div class="card"><ul class="list">${j.usuarios.map(u=>`<li class="click" data-uid="${esc(u.uid)}"><div class="tx"><b>${esc(u.email)}</b><small>Últ. acceso ${hace(u.ultimo)} · ${u.listas} listas · cuota ${u.cuota.usadas}/${u.cuota.limite??"∞"}${u.nota?" · 📝":""}</small></div>${planPill(u)}</li>`).join("")||`<li class="muted">Sin resultados.</li>`}</ul></div>`;
},
async planes(){
  const j=await api("planes"), st=j.paypal;
  const est={activa:`<span class="pill ok">Activa</span>`,pendiente:`<span class="pill warn">Pendiente</span>`,suspendida:`<span class="pill bad">Suspendida</span>`,cancelada:`<span class="pill gratis">Cancelada</span>`,expirada:`<span class="pill gratis">Expirada</span>`};
  const pasos=`<ol class="small" style="margin:10px 0 0;padding-left:18px;line-height:1.65">
    <li>Necesitas una <b>cuenta PayPal Business</b>. Entra en <a href="https://developer.paypal.com/dashboard/applications" target="_blank" rel="noopener">developer.paypal.com → Apps &amp; Credentials</a>, elige <b>Sandbox</b> (pruebas) o <b>Live</b> (real) y crea una app. Copia <b>Client ID</b> y <b>Secret</b>.</li>
    <li>En Vercel → quecompro-precios → Settings → Environment Variables añade <code>PAYPAL_CLIENT_ID</code>, <code>PAYPAL_CLIENT_SECRET</code> (Sensitive) y <code>PAYPAL_ENV</code> = <code>sandbox</code> o <code>live</code>. Redespliega.</li>
    <li>Vuelve aquí: aparecerá el formulario para <b>crear el plan</b> de suscripción con el precio. Copia el id <code>P-…</code> en <code>PAYPAL_PLAN_ID</code> (y opcional <code>PAYPAL_PRECIO_TEXTO</code>, p. ej. «2,99 €/mes»). Redespliega.</li>
    <li>En la app de PayPal → <b>Webhooks</b> → Add webhook: <code>${esc(st.webhook)}</code> con los eventos <code>BILLING.SUBSCRIPTION.*</code> y <code>PAYMENT.SALE.COMPLETED</code>.</li></ol>`;
  return `<h2>Planes y pagos</h2>
  <div class="kpis"><div class="kpi"><small>Usuarios Pro</small><b>${nf.format(j.pro.total)}</b><i>${j.pro.temporales} temporales</i></div>
    <div class="kpi"><small>Suscripciones activas</small><b>${nf.format(st.suscripciones.activas)}</b><i>${st.suscripciones.impago} con impago · ${st.suscripciones.cancelan} cancelan</i></div>
    <div class="kpi"><small>Pro por código o manual</small><b>${nf.format(j.pro.por_codigo_o_manual)}</b><i>sin suscripción</i></div>
    <div class="kpi"><small>Códigos</small><b>${nf.format(j.codigos.length)}</b><i>${j.codigos.filter(c=>c.activo).length} activos</i></div></div>
  <div class="card" style="margin-top:12px"><div class="row"><h3 class="grow" style="margin:0">PayPal</h3>${st.activo?`<span class="pill ok">Activo · ${esc(st.modo)}</span>`:st.credenciales?`<span class="pill warn">Falta el plan · ${esc(st.modo)}</span>`:`<span class="pill gratis">Sin configurar</span>`}</div>
  ${st.activo?`<dl class="kv" style="margin-top:10px"><dt>Precio mostrado</dt><dd>${esc(st.precio||"— (PAYPAL_PRECIO_TEXTO)")}</dd><dt>Webhook</dt><dd><code class="small">${esc(st.webhook)}</code></dd>${st.ultimo_error?`<dt>Último error</dt><dd style="color:var(--chili)">${fecha(st.ultimo_error.t)} · ${esc(st.ultimo_error.error)}</dd>`:""}</dl>
    <p class="small"><a href="https://www.${st.modo==="sandbox"?"sandbox.":""}paypal.com/billing/subscriptions" target="_blank" rel="noopener">Abrir suscripciones en PayPal ↗</a></p>`:pasos}
  ${st.credenciales?`<form id="fPlanPP" class="row" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><b class="small" style="width:100%">${st.plan?"Crear otro plan (p. ej. para cambiar el precio)":"Crear el plan de suscripción"}</b>
    <input class="inp" name="precio" inputmode="decimal" placeholder="2,99" required style="width:100px"><span class="small muted">€ /</span><select class="inp" name="intervalo"><option value="MONTH">mes</option><option value="YEAR">año</option></select><button class="btn p">Crear plan en PayPal</button></form><div id="planRes" class="small" style="margin-top:8px"></div>`:""}</div>
  ${j.suscriptores.length?`<div class="card"><h3 style="margin-top:0">Suscriptores</h3><ul class="list">${j.suscriptores.map(x=>`<li class="click" data-uid="${esc(x.uid)}"><div class="tx"><b>${esc(x.email)}</b><small>${x.hasta?`${x.estado==="cancelada"?"Pro hasta":"próximo cobro"} ${fecha(x.hasta)}`:""}${x.impago?" · ⚠️ impago":""}</small></div>${est[x.estado]||`<span class="pill gratis">${esc(x.estado)}</span>`}</li>`).join("")}</ul></div>`:""}
  <div class="card"><h3 style="margin-top:0">Crear código Pro</h3><form id="fCodigo">
    <div class="row" style="margin-bottom:8px"><input class="inp grow" name="codigo" placeholder="Código (vacío = aleatorio)" autocapitalize="characters" style="text-transform:uppercase">
      <select class="inp" name="dias"><option value="7">7 días</option><option value="30" selected>30 días</option><option value="90">90 días</option><option value="365">1 año</option><option value="0">Permanente</option></select></div>
    <div class="row" style="margin-bottom:8px"><label class="small muted">Usos <input class="inp" name="max" type="number" min="1" value="1" style="width:90px"></label><label class="small muted">Caduca <input class="inp" name="caduca" type="date"></label></div>
    <div class="row"><input class="inp grow" name="nota" placeholder="Nota (para quién / campaña)" maxlength="200"><button class="btn p">Crear código</button></div></form></div>
  <div class="card"><h3 style="margin-top:0">Códigos</h3><ul class="list">${j.codigos.map(c=>`<li><div class="tx"><b style="font-family:ui-monospace,monospace">${esc(c.codigo)}</b><small>${c.dias?c.dias+" días":"Permanente"} · ${c.usos}/${c.max} usos${c.caduca?" · caduca "+fdia(c.caduca):""}${c.nota?" · "+esc(c.nota):""}</small></div>

    if(a==="email"){ const r=await hazlo("email_prueba",{},"Email enviado"); toast("Enviado a "+r.a); return; }
    if(a==="almacen"){ const box=$("#almacen"); box.textContent="Calculando…"; b.disabled=true;
      try{ const j=await api("almacenamiento"); box.innerHTML=`<p style="margin:0 0 6px"><b>${nf.format(j.total.blobs)} blobs · ${bytes(j.total.bytes)}</b>${j.truncado?" (truncado)":""}</p><div class="scroll"><table><thead><tr><th>Carpeta</th><th class="n">Blobs</th><th class="n">Tamaño</th><th>Último</th></tr></thead><tbody>${j.carpetas.map(c=>`<tr><td><code>${esc(c.carpeta)}</code></td><td class="n">${nf.format(c.blobs)}</td><td class="n">${bytes(c.bytes)}</td><td class="small">${fecha(c.ultimo)}</td></tr>`).join("")}</tbody></table></div>`; }
      catch(err){ box.textContent="Error: "+err.message; } finally{ b.disabled=false; } return; }
    if(a==="limpia"){ const tipo=b.dataset.tipo, dias=+($("#limDias")?.value||90); if(!confirm(tipo==="cuotas"?"¿Borrar contadores anónimos de semanas pasadas?":`¿Borrar ${tipo} de hace ${dias} días o más? No se puede deshacer.`)) return;
      const r=await hazlo("limpieza",{tipo,dias}); toast(r.borrados!=null?`${r.borrados} borrados`:`${r.dias_borrados} días borrados`); return; }
    if(a==="embudo"){ const box=$("#embudo"); box.textContent="Calculando…"; b.disabled=true;
      try{ const j=await api("embudo"); const pc=Object.entries(j.por_cadena||{}).sort((x,y)=>y[1].listas-x[1].listas);
        box.innerHTML=`<p style="margin:0 0 6px;color:var(--ink)"><b>${nf.format(j.total.listas)} listas</b> · cesta media ${j.total.cesta_media.toLocaleString("es-ES",{style:"currency",currency:"EUR"})} · ${nf.format(j.total.combinadas)} combinadas · ${nf.format(j.eventos)} eventos</p>
        <div class="scroll"><table><thead><tr><th>Cadena</th><th class="n">Listas</th><th class="n">Cesta media</th><th class="n">Ofertas</th><th class="n">Clics</th><th class="n">Carrito</th><th class="n">Copiar</th></tr></thead><tbody>${pc.map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td class="n">${nf.format(v.listas)}</td><td class="n">${v.cesta_media.toLocaleString("es-ES",{style:"currency",currency:"EUR"})}</td><td class="n">${nf.format(v.ofertas_usadas)}</td><td class="n">${nf.format(v.clics)}</td><td class="n">${nf.format(v.carrito)}</td><td class="n">${nf.format(v.copiar)}</td></tr>`).join("")}</tbody></table></div>`; }
      catch(err){ box.textContent="Error: "+err.message; } finally{ b.disabled=false; } return; }
  }catch(err){}
});
document.addEventListener("submit",async(e)=>{
  e.preventDefault(); const f=e.target, fd=Object.fromEntries(new FormData(f));
  if(f.id==="fPlanPP"){ const btn=f.querySelector("button"); btn.disabled=true; try{ const r=await api("paypal_plan",{},{precio:fd.precio,intervalo:fd.intervalo}); $("#planRes").innerHTML=`<div class="card" style="background:var(--leaf-soft);margin:0"><b>Plan creado:</b> <code>${esc(r.plan_id)}</code> (${esc(r.precio)} ${esc(r.moneda)}/${r.intervalo==="YEAR"?"año":"mes"})<br><span class="small">Copia este id en Vercel como <code>PAYPAL_PLAN_ID</code> y redespliega.</span> <button type="button" class="btn" data-a="copiar" data-txt="${esc(r.plan_id)}">Copiar</button></div>`; }catch(err){ $("#planRes").innerHTML=`<div class="card" style="background:var(--chili-soft);color:var(--chili);margin:0"><b>⚠️ ${esc(err.message)}</b></div>`; } finally{ btn.disabled=false; } return; }
  if(f.id==="fCodigo"){ try{ const r=await api("codigo_crear",{},{codigo:fd.codigo,dias:+fd.dias,max:+fd.max||1,caduca:fd.caduca||null,nota:fd.nota}); toast("Código creado: "+r.codigo.codigo); try{ await navigator.clipboard.writeText(r.codigo.codigo); }catch(e){} pinta("planes"); }catch(err){ toast("⚠️ "+err.message); } return; }
  if(f.id==="fBusca"){ ST.filtro={q:fd.q||"",plan:fd.plan||"",estado:fd.estado||""}; return pinta("usuarios"); }
  if(f.id==="fNuevo"){ try{ const r=await api("usuario_crear",{},{email:fd.email,plan:fd.plan,enviar:!!fd.enviar}); toast(r.existia?"Ya existía: plan actualizado":"Cuenta creada"+(r.enviado?" y enlace enviado":"")); ficha(r.uid); }catch(err){ toast("⚠️ "+err.message); } return; }
  if(f.id==="fLogin"){ const btn=f.querySelector("button"); btn.disabled=true;
    try{ const r=await fetch("/api/cuenta?accion=enlace",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:fd.email,volver:"admin"})}); const j=await r.json(); if(!r.ok) throw new Error(j.error||"Error");
      f.outerHTML=`<p><b>Enlace enviado.</b> Ábrelo en este navegador: volverás directamente al panel.</p>`; }catch(err){ toast("⚠️ "+err.message); btn.disabled=false; } }
});
(async()=>{
  try{ const j=await api("resumen"); ST.pre=j; $("#who").textContent=j.yo; $("#tabs").classList.remove("hidden"); ST.tab=(location.hash.slice(1)in VISTAS)?location.hash.slice(1):"resumen"; pinta(); }
  catch(e){ if(e.status===401||e.status===403) acceso(e); else $("#main").innerHTML=`<div class="card">Error: ${esc(e.message)}</div>`; }
})();
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(h in VISTAS) pinta(h); });
document.addEventListener("click",(e)=>{ const t=e.target.closest("[data-tab]"); if(t) history.replaceState(null,"","#"+t.dataset.tab); },true);
</script>
</body>
