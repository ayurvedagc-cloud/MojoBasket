<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MojoBasket · Tu compra semanal en Canarias</title>
<meta name="description" content="Menú semanal, recetas y lista de la compra con precios reales de Mercadona, HiperDino, SPAR y Lidl en Canarias.">
<meta name="theme-color" content="#0A5E8C">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta property="og:title" content="MojoBasket">
<meta property="og:description" content="La semana resuelta, al mejor precio.">
<meta property="og:image" content="https://mojobasket.es/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
/* Paleta canaria: Atlántico · Canario · Picón · Tabaiba · Almagre · Duna */
--bg:#f4e7cf; --card:#fffcf5; --ink:#1f1d1b; --muted:#5e5547; --line:#e3d4b8;
--accent:#ffc72c; --accent-ink:#1f1d1b; --accent-soft:#fff1c7;
--atl:#0a5e8c; --atl-soft:#dcebf4;
--leaf:#3f6a2b; --leaf-soft:#e2ecd9; --chili:#a9442a; --chili-soft:#f6e1d9;
--r:22px; --shadow:0 1px 2px rgba(31,29,27,.05),0 6px 20px rgba(31,29,27,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:16px;line-height:1.45}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px 20px 120px}
.serif{font-family:"Fraunces",Georgia,serif}
em.it{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:400;color:var(--atl)}
h1{font-size:34px;line-height:1.08;margin:6px 0 10px;font-weight:700;letter-spacing:-.02em}
h2{font-size:22px;margin:0 0 8px;letter-spacing:-.01em}
.nb{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.nb i{font-style:normal;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;line-height:1.5}
.nb .ns{color:#fff;min-width:16px;text-align:center}.nb .nova{background:var(--line);color:var(--ink)}.nb .nova.n4{background:var(--chili-soft);color:var(--chili)}
.nb .alg{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}.nb .alw{background:var(--chili);color:#fff}
.nsbar{display:flex;gap:2px;border-radius:9px;overflow:hidden;margin-top:8px}.nsbar i{font-style:normal;color:#fff;font-size:12px;font-weight:700;text-align:center;padding:4px 0;min-width:28px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 22px;font-size:17px}
/* top bar */
.topbar{display:flex;align-items:center;gap:14px;margin:4px 0 26px}
.back{width:46px;height:46px;border-radius:15px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.back[disabled]{opacity:.35;cursor:default}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.dots i.done{background:var(--ink)} .dots i.on{background:var(--atl)}
.count{font-weight:600;color:var(--muted);font-size:15px;min-width:34px;text-align:right}
/* grids & chips */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mapa{margin-top:14px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:#efe2c8}
.mapa svg{display:block;width:100%;height:auto;cursor:crosshair}
.mapa svg a{cursor:pointer}
.leyenda{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.ley{display:inline-flex;align-items:center;gap:6px}.ley i{width:12px;height:12px;border-radius:50%;display:inline-block;box-sizing:border-box}
.tienda{background:var(--card);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);margin-top:8px;border:2px solid transparent}
.tienda.sel{border-color:var(--atl)}
.tienda .dot{width:14px;height:14px;border-radius:50%;flex:none}
.tienda .tx{flex:1;min-width:0}.tienda .tx b{display:block;font-size:15.5px}.tienda .tx small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.tienda .tag{font-weight:700;color:var(--muted)}.tienda .tag.real{color:var(--leaf)}.tienda a.ext{color:var(--atl);font-weight:700;text-decoration:none}
.tienda .add{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);font-size:22px;font-weight:700;flex:none}
.tienda .add.on{background:var(--atl);color:#fff}
.tile{background:var(--card);border-radius:var(--r);min-height:86px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:var(--shadow);border:2px solid transparent;transition:.15s;text-align:center}
.tile b{font-size:18px;letter-spacing:-.01em}
.tile small{color:var(--muted);font-size:12.5px}
.tile.sel{border-color:var(--ink);background:var(--accent-soft)}
.tile .ico{font-size:28px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.optn{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 14px 12px 16px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:600;font-size:16.5px;transition:.15s}
.chip .pm{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted);line-height:1}
.chip.sel{background:var(--accent-soft);border-color:var(--ink)}
.chip.sel .pm{background:var(--ink);border-color:var(--ink);color:var(--accent)}
.chip.neg.sel{background:var(--chili-soft);border-color:var(--chili)}
.chip.neg.sel .pm{background:var(--chili);border-color:var(--chili);color:#fff}
.section-label{font-weight:700;font-size:14px;color:var(--muted);margin:22px 0 10px;text-transform:uppercase;letter-spacing:.08em}
/* budget */
.budget{text-align:center;padding:30px 0 10px;border-radius:30px;background:radial-gradient(circle at 50% 45%,#ffe28f 0,rgba(255,226,143,.35) 45%,transparent 70%)}
.budget .big{font-family:"Fraunces",serif;font-size:96px;font-weight:600;line-height:1;letter-spacing:-.03em}
.budget .big sup{font-size:34px;vertical-align:top;position:relative;top:10px;margin-left:4px}
.budget .per{color:var(--muted);font-weight:600;margin-top:8px}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:12px;border-radius:9px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--line) var(--p,50%));margin:26px 0 6px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--card);border:4px solid var(--ink);box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--card);border:4px solid var(--ink)}
.range-ends{display:flex;justify-content:space-between;color:var(--muted);font-weight:600;font-size:14px}
.row-card{background:var(--card);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);margin-top:16px}
.row-card .ic{width:50px;height:50px;border-radius:15px;background:var(--accent-soft);display:grid;place-items:center;font-size:22px;flex:none}
.row-card .tx{flex:1}
.row-card .tx b{display:block;font-size:17px}
.row-card .tx small{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:42px;height:42px;border-radius:13px;background:#efe2c8;font-size:22px;font-weight:600}
.diner{background:var(--card);border-radius:var(--r);padding:14px 16px 16px;box-shadow:var(--shadow);margin-top:12px}
.diner h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.diner h3 small{color:var(--muted);font-weight:600;font-size:13px;text-align:right}
.seg{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:10px 8px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.seg button.sel{border-color:var(--ink);background:var(--accent-soft)}
.seg.act button{font-size:13px;padding:8px 4px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.nums input{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:17px;background:var(--card);outline:none;color:var(--ink)}
.nums input:focus{border-color:var(--ink)}
.nums input.bad{border-color:#d9534f}
.btn.mini{height:auto;padding:8px 10px;font-size:13px;flex:none;text-decoration:none;white-space:nowrap}
a.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.lsel{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -2px}
.lsel button{flex:none;min-width:118px;text-align:left;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:2px}
.lsel button b{font-size:14px}.lsel button span{font-family:"Fraunces",serif;font-size:20px}.lsel button small{color:var(--muted);font-size:11.5px;font-weight:600}
.lsel button.on{border-color:var(--ink);background:var(--accent-soft)}
.cmpwrap{overflow-x:auto;margin:0 -6px}
table.cmp{border-collapse:collapse;width:100%;font-size:13.5px}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
.cmp th:first-child,.cmp td:first-child{text-align:left;white-space:normal;min-width:110px;position:sticky;left:0;background:var(--card)}
.cmp th small,.cmp td small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.cmp td.best{color:var(--leaf);font-weight:700;background:var(--leaf-soft)}
.cmp td.na{color:var(--muted)}.cmp td i{font-style:normal;margin-left:2px}
.cmp tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.stepper span{font-family:"Fraunces",serif;font-size:28px;min-width:30px;text-align:center}
/* days */
.days{display:flex;gap:8px;justify-content:space-between}
.day{flex:1;max-width:66px;border:2.5px solid var(--ink);border-radius:999px;padding:16px 0 12px;display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--card);font-weight:700;font-size:19px;transition:.15s}
.day i{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);display:block}
.day.sel{background:var(--card)} .day.sel i{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 7px var(--ink),inset 0 0 0 20px var(--accent)}
.day:not(.sel){border-color:var(--line);color:var(--muted)}
.center-note{text-align:center;color:var(--muted);font-weight:600;margin:18px 0}
/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:16px}
.search input{border:0;outline:0;background:none;flex:1;font-size:17px}
/* upload */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;background:var(--card);color:var(--muted)}
.drop b{color:var(--ink)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.thumbs div{position:relative}
.thumbs img{width:76px;height:96px;object-fit:cover;border-radius:12px;display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px}
textarea{width:100%;min-height:110px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:14px;resize:vertical;outline:none}
textarea:focus{border-color:var(--ink)}
/* CTA */
.cta-wrap{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 70%,rgba(244,231,207,0));z-index:5}
.cta{max-width:520px;margin:0 auto;display:flex;width:100%;align-items:center;justify-content:center;gap:10px;height:62px;border-radius:22px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:19px;box-shadow:0 8px 24px rgba(255,199,44,.4);transition:.15s}
.cta[disabled]{background:#e3d4b8;color:#6f6556;box-shadow:none;cursor:default}
.cta.dark{background:var(--ink);color:#fff;box-shadow:none}
.hint{display:flex;gap:10px;align-items:flex-start;color:var(--muted);margin-top:24px;font-size:15px}
.hint b{color:var(--ink)}
/* dosha */
.dosha{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dosha .tile{min-height:74px;padding:10px 6px}
.dosha .tile b{font-size:15px}
/* loading */
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-top:12vh}
.pot{font-size:64px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.prog{width:220px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:10%;transition:width .4s}
/* result */
.res-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:700;background:var(--leaf-soft);color:var(--leaf)}
.pill.warn{background:var(--chili-soft);color:var(--chili)}
.pill.offer{background:var(--chili-soft);color:var(--chili)}
.tabs{display:flex;gap:6px;background:#e9dbc0;border-radius:16px;padding:5px;margin:18px 0}
.tabs button{flex:1;padding:11px 6px;border-radius:12px;font-weight:700;color:var(--muted);font-size:15px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.stat{display:flex;gap:10px;margin-top:12px}
.stat>div{flex:1;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.stat small{color:var(--muted);font-weight:600;font-size:12.5px;display:block}
.stat b{font-family:"Fraunces",serif;font-size:26px;font-weight:600}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 6px}
.sec-title h3{margin:0;font-size:16px}
.sec-title span{color:var(--muted);font-size:14px;font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.cb{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:15px}
.item.done .cb{background:var(--leaf);border-color:var(--leaf)}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item .nm{flex:1;min-width:0}
.item .nm b{font-weight:600;display:block}
.item .nm small{color:var(--muted);font-size:13.5px}
.item .pr{font-weight:700;white-space:nowrap;text-align:right}
.item .pr small{display:block;font-size:11.5px;color:var(--chili);font-weight:700}
.item a.ext{color:var(--atl);font-weight:700;text-decoration:none}
.daycard h3{margin:0 0 8px;font-family:"Fraunces",serif;font-weight:600;font-size:20px}
.meal{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.meal:first-of-type{border-top:0}
.meal .t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;width:74px;flex:none}
.meal .n{flex:1;font-weight:600}
.meal .go{color:var(--muted)}
.rec h3{margin:0 0 6px;font-family:"Fraunces",serif;font-size:22px;font-weight:600;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.meta span{font-size:13px;font-weight:600;background:#efe2c8;border-radius:999px;padding:5px 10px}
.rec ul,.rec ol{margin:6px 0 10px;padding-left:20px}
.rec li{margin:4px 0}
.rec .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:10px}
.churna{background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin-top:10px;font-size:15px}
.churna b{display:block;margin-bottom:2px}
.nutri{background:var(--leaf-soft);border-radius:16px;padding:12px 14px;margin-top:10px;font-size:15px;color:#2c4a1e}
details.rec summary{list-style:none;cursor:pointer}
details.rec summary::-webkit-details-marker{display:none}
details.rec summary .sm{color:var(--muted);font-size:14px}
details.rec[open] summary .sm{display:none}
.actions{display:flex;gap:10px;margin:14px 0}
.btn{flex:1;height:50px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:var(--ink);color:#fff}
.err{background:var(--chili-soft);color:var(--chili);border-radius:16px;padding:14px 16px;font-weight:600;margin:14px 0}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tips li{margin:6px 0}
.small{font-size:13.5px;color:var(--muted)}
.hidden{display:none!important}
.legal{max-width:560px;margin:-96px auto 0;padding:0 20px 120px;text-align:center;font-size:12.5px;color:var(--muted)}.legal a{color:var(--muted)}
.cuenta-pill{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));z-index:15;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;box-shadow:var(--shadow)}
.cuenta-pill.on{background:var(--atl);border-color:var(--atl);color:#fff}
.app.con-pill{padding-top:58px}
dialog.cuenta{border:0;border-radius:24px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(31,29,27,.3)}
dialog.cuenta::backdrop{background:rgba(31,29,27,.45)}
.cuenta .in{padding:22px 22px 18px}
.cuenta h2{font-family:"Fraunces",Georgia,serif;font-size:26px;line-height:1.15;margin:0 0 8px}
.cuenta .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:12px;background:var(--bg);font-size:20px}
.cuenta input[type=email]{width:100%;height:52px;border:1.5px solid var(--line);border-radius:16px;padding:0 16px;background:#fff;font-size:17px}
.cuenta .btnp{width:100%;height:52px;border-radius:16px;background:var(--accent);font-weight:700;font-size:17px;margin-top:10px}
.cuenta .btnp:disabled{opacity:.6}
.cuenta .planes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.cuenta .planes div{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:13.5px}
.cuenta .planes b{display:block;font-size:15px;margin-bottom:2px}
.cuenta .barra{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 4px}.cuenta .barra i{display:block;height:100%;background:var(--atl)}
.cuenta .hist{list-style:none;margin:8px 0 0;padding:0}
.cuenta .hist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cuenta .hist .tx{flex:1;min-width:0}.cuenta .hist .tx b{display:block}.cuenta .hist .tx small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cuenta .hist button{border-radius:12px;padding:8px 12px;font-weight:700;background:var(--atl-soft);color:var(--atl)}.cuenta .hist button.del{background:none;color:var(--muted);padding:8px}

}

function shrink(file){
return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file);
img.onload=()=>{ const m=1400, k=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement("canvas");
c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
c.toBlob(b=>{ URL.revokeObjectURL(u); b?res({blob:b,url:URL.createObjectURL(b)}):rej() },"image/jpeg",.82); };
img.onerror=rej; img.src=u; });
}

const DIETA_ALERG = { singluten:["gluten"], sinlactosa:["leche"], sinlacteos:["leche"], sinhuevo:["huevo"], sinfrutossecos:["frutos de cáscara","cacahuete"], sinmarisco:["crustáceos","moluscos"], sinsoja:["soja"] };
async function enriquecerNutricion(plan){
const refs=new Map();
planListas(plan).forEach(L=>(L.lista||[]).forEach(sec=>(sec.items||[]).forEach(it=>{ if(it.ref&&!it.despensa&&!it.nofound&&!refs.has(it.ref)) refs.set(it.ref,it.nombre); })));
if(!refs.size) return;
const ent=[...refs.entries()].slice(0,80), lotes=[];
for(let i=0;i<ent.length;i+=20) lotes.push(ent.slice(i,i+20));
const datos={};
await Promise.all(lotes.map(async l=>{
const q=l.map(([r,n])=>/^(hiperdino|lidl):/.test(r)?`${r}~${String(n).replace(/[|~]/g," ").slice(0,80)}`:r).join("|");
try{ const j=await api(`/api/nutricion?cp=${CP}&p=${encodeURIComponent(q)}`); Object.assign(datos,j.datos||{}); }catch(e){ console.warn("nutricion",e); }
}));
plan.nutri=datos;
}
function conflictos(n){
if(!n) return [];
const out=[];
P.diets.forEach(d=>(DIETA_ALERG[d]||[]).forEach(a=>{ if(n.alergenos?.includes(a)) out.push(a); else if(n.trazas?.includes(a)) out.push("trazas de "+a); }));
if(P.diets.includes("vegano")&&n.vegano===false) out.push("no vegano");
else if(P.diets.includes("vegetariano")&&n.vegetariano===false) out.push("no vegetariano");
return [...new Set(out)];
}
const NS_COL={A:"#038141",B:"#85bb2f",C:"#fecb02",D:"#ee8100",E:"#e63e11"};
function nutriBadges(it){
const n=it.ref&&S.plan?.nutri?.[it.ref]; if(!n) return "";
const c=conflictos(n);
const tit=[n.nombre_off&&("OFF: "+n.nombre_off+(n.coincidencia?` (coincidencia ${n.coincidencia} %)`:"")),n.alergenos?.length&&"Alérgenos: "+n.alergenos.join(", "),n.trazas?.length&&"Trazas: "+n.trazas.join(", "),n.kcal_100!=null&&`${n.kcal_100} kcal · ${n.proteinas_100??"?"} g prot · ${n.azucares_100??"?"} g azúcar · ${n.sal_100??"?"} g sal /100 g`].filter(Boolean).join("\n");
return `<span class="nb" title="${esc(tit)}">${n.fuente==="nombre"?`<i class="nova" title="Dato de un producto equivalente (búsqueda por nombre)">≈</i>`:""}${n.nutriscore?`<i class="ns" style="background:${NS_COL[n.nutriscore]}">${n.nutriscore}</i>`:""}${n.nova?`<i class="nova n${n.nova}">NOVA ${n.nova}</i>`:""}${n.alergenos?.length&&!c.length?`<i class="alg">${esc(n.alergenos.join(", "))}</i>`:""}${c.length?`<i class="alw">⚠️ ${esc(c.join(", "))}</i>`:""}</span>`;
}

const nu=S.plan?.nutri; if(!nu) return "";

function optimoHTML(){
const p=S.plan, o=p.opt; if(!o||o.sids.length<2) return "";
const prm={...OPT_DEF,...(p.optParams||{})}, n=o.sids.length, mx=prm.max||n, mix=planListas().find(l=>l.tipo==="mix");
const btn=(attr,v,label,on)=>`<button class="chip${on?" sel":""}" style="padding:8px 14px;font-size:15px" ${attr}="${v}">${label}</button>`;
const libre=mejorReparto(o,{modo:"fijo",extra:0,max:n}), libreT=r2(libre.asig.reduce((a,s,k)=>a+(s?o.best[k][s].coste:0),0));
const dist=o.dist||{}, conDist=Object.keys(dist).length>0;
const tarifas=[[0,"0 €/km",""],[0.15,"0,15 €/km","a pie · bici"],[0.3,"0,30 €/km","coche"],[0.5,"0,50 €/km","coche + tiempo"],[1,"1 €/km","taxi"]];
const distTxt=o.sids.map(s=>{ const d=dist[s]; const nm=(o.supers.find(x=>x.id===s)||{}).n||s; return d?`${esc(nm)}: ${esc(d.nombre)} a ${km(d.km)}${prm.modo==="distancia"?` (+${eur(viajeDe(o,prm,s)||0)})`:""}`:`${esc(nm)}: sin tienda en el mapa (coste fijo ${eur(prm.extra)})`; }).join("<br>");
return `<div class="card"><div class="sec-title"><h3>🧮 Cesta óptima</h3></div>
<p class="small" style="margin:6px 0 4px">Calcula la combinación exacta de súpers y formatos más barata que cubre la cantidad de cada ingrediente. Ir a cada súper tiene un coste de desplazamiento, para no repartir la compra por céntimos.</p>
<div class="section-label" style="margin:14px 0 8px">Cómo contar el desplazamiento</div>
<div class="chips" style="gap:8px">${btn("data-optmodo","distancia","📍 Por distancia",prm.modo==="distancia")}${btn("data-optmodo","fijo","Coste fijo por súper",prm.modo!=="distancia")}</div>
${prm.modo==="distancia"?`<div class="section-label" style="margin:14px 0 8px">Tarifa por km (ida y vuelta)</div>
<div class="chips" style="gap:8px">${tarifas.map(([v,l,sub])=>btn("data-optt",v,l+(sub?` <small style="font-weight:500;color:var(--muted)">${sub}</small>`:""),Math.abs(+prm.tarifa-v)<1e-9)).join("")}</div>
<p class="small" style="margin:10px 0 0">Desde <b>${esc(o.pos?.label||posUsuario().label)}</b>, a la tienda más cercana de cada cadena:<br>${distTxt}</p>`:`<div class="section-label" style="margin:14px 0 8px">Coste de añadir un súper</div>
<div class="chips" style="gap:8px">${[0,1,2,3,5,8].map(v=>btn("data-optx",v,v?eur(v):"0 €",+prm.extra===v)).join("")}</div>`}
<div class="section-label" style="margin:14px 0 8px">Máximo de súpers</div>
<div class="chips" style="gap:8px">${Array.from({length:n},(_,i)=>btn("data-optm",i+1,String(i+1),mx===i+1)).join("")}</div>
${mix?`<p class="small" style="margin:14px 0 0;color:var(--ink)">Resultado: <b>${eur(mix.total)}</b> de compra${mix.viaje?` + <b>${eur(mix.viaje)}</b> de desplazamiento`:""} en ${mix.tiendas} súper${mix.tiendas>1?"s":""} (${esc(planListas().filter(l=>l.tipo!=="mix"&&(mix.lista||[]).some(sec=>sec.items.some(i=>i.tiendaId===l.id))).map(l=>l.nombre).join(" + "))})${mix.faltan?` · faltan ${mix.faltan}`:""}.
${libre.usados.length>mix.tiendas&&libreT<mix.total-0.004?`<br>Repartiendo en ${libre.usados.length} súpers sin contar desplazamientos la compra serían ${eur(libreT)} (${eur(mix.total-libreT)} menos), pero no compensa el viaje.`:""}
${mix.ahorroFormatos>0.004?`<br>Eligiendo formatos ahorras ${eur(mix.ahorroFormatos)} frente a la primera selección.`:""}</p>`:""}</div>`;
}
function compararHTML(){
const p=S.plan, c=p.comparativa, ls=planListas();
const mix=ls.find(l=>l.tipo==="mix"), solos=ls.filter(l=>l.tipo!=="mix");
const conViaje=l=>r2(l.total+(l.viaje||0));
const completos=solos.filter(l=>!l.faltan), mejor=(completos.length?completos:solos).slice().sort((a,b)=>conViaje(a)-conViaje(b))[0];
const tot=Object.fromEntries(solos.map(l=>[l.id,l]));
const resumen=mix&&mejor?`<div class="card"><div class="sec-title"><h3>Resumen</h3></div>
<p class="small" style="margin:6px 0 0;color:var(--ink)">💡 <b>Combinada:</b> ${eur(mix.total)}${mix.viaje?` + ${eur(mix.viaje)} viaje = <b>${eur(conViaje(mix))}</b>`:""} en ${mix.tiendas} súper${mix.tiendas>1?"s":""}${mix.faltan?` (faltan ${mix.faltan})`:""}<br>
🏆 <b>Mejor en un solo súper:</b> ${esc(mejor.nombre)} · ${eur(mejor.total)}${mejor.viaje?` + ${eur(mejor.viaje)} viaje = <b>${eur(conViaje(mejor))}</b>`:""}${mejor.faltan?` (faltan ${mejor.faltan})`:""}<br>
${conViaje(mejor)-conViaje(mix)>0.005?`💶 Comprando en varios ahorras <b>${eur(conViaje(mejor)-conViaje(mix))}</b> (${Math.round((1-conViaje(mix)/conViaje(mejor))*100)}%), desplazamiento incluido.`:"Ir a un solo súper sale igual o más barato, desplazamiento incluido."}</p>
${c.supers.some(s=>!s.real)?`<p class="small" style="margin:8px 0 0">≈ = precio estimado (súper sin catálogo online); solo se elige frente a un precio real si es más de un 5 % más barato. ✓ = precio real de hoy.</p>`:""}</div>`:"";
const cab=c.supers.map(s=>`<th>${esc(s.n)}<small>${s.real?"✓ real":"≈ estim."}</small></th>`).join("");
const filas=c.filas.map(f=>`<tr><td><b>${esc(f.consulta)}</b>${f.cantidad?`<small>${esc(f.cantidad)}</small>`:""}</td>${c.supers.map(s=>{ const x=f.precios[s.id]; return x?`<td class="${f.mejor===s.id?"best":""}" title="${esc(x.nombre)}">${x.real?"":"≈"}${eur(x.coste)}${x.oferta?"<i>🏷️</i>":""}</td>`:`<td class="na">—</td>`; }).join("")}</tr>`).join("");
const pie=`<tr class="tot"><td>Total</td>${c.supers.map(s=>`<td>${eur(tot[s.id]?.total)}${tot[s.id]?.faltan?`<small>faltan ${tot[s.id].faltan}</small>`:""}</td>`).join("")}</tr>`;
return `${optimoHTML()}${resumen}<div class="card"><div class="sec-title"><h3>Precio por producto</h3></div><p class="small" style="margin:4px 0 8px">Coste de la cantidad necesaria en cada súper, con el formato más barato. En verde, dónde lo compra la cesta óptima.</p>
<div class="cmpwrap"><table class="cmp"><thead><tr><th>Producto</th>${cab}</tr></thead><tbody>${filas}${pie}</tbody></table></div></div>`;
}

mercadona:{tienda:"https://tienda.mercadona.es/",carrito:"https://tienda.mercadona.es/",buscar:q=>`https://tienda.mercadona.es/search-results?query=${enc(q)}`,nota:"Introduce tu código postal al entrar: la web te dice si reparte en tu zona. Pedido mínimo y gastos de envío según la web."},
spar:{tienda:"https://www.spargrancanariaonline.es/",carrito:"https://www.spargrancanariaonline.es/cart",buscar:q=>`https://www.spargrancanariaonline.es/search?q=${enc(q)}`,nota:"Tienda online de SPAR Gran Canaria: envío a domicilio o recogida en tienda."},
hiperdino:{tienda:"https://www.hiperdino.es/c9499/",carrito:"https://www.hiperdino.es/c9499/hdcheckout/cart/",buscar:q=>`https://www.hiperdino.es/c9499/catalogsearch/result/?q=${enc(q)}`,nota:"Confirma tu código postal al entrar para ver franjas de entrega y recogida."},
carrefour:{tienda:"https://www.carrefour.es/supermercado",carrito:"https://www.carrefour.es/cart",buscar:q=>`https://www.carrefour.es/?q=${enc(q)}`,nota:"Carrefour reparte también en Canarias; revisa franjas y gastos al introducir tu dirección."},
alcampo:{tienda:"https://www.compraonline.alcampo.es/",carrito:"https://www.compraonline.alcampo.es/basket",buscar:q=>`https://www.compraonline.alcampo.es/search?q=${enc(q)}`,nota:"Alcampo reparte en Gran Canaria y Tenerife; comprueba tu código postal."},
dia:{tienda:"https://www.dia.es/",carrito:"https://www.dia.es/cart",buscar:q=>`https://www.dia.es/search?q=${enc(q)}`,nota:"Comprueba si Dia reparte en tu código postal."},
eroski:{tienda:"https://supermercado.eroski.es/",carrito:"https://supermercado.eroski.es/",buscar:q=>`https://supermercado.eroski.es/es/search/results/?q=${enc(q)}`,nota:"Comprueba si Eroski reparte en tu código postal."},
eci:{tienda:"https://www.elcorteingles.es/supermercado/",carrito:"https://www.elcorteingles.es/supermercado/",buscar:q=>`https://www.elcorteingles.es/supermercado/buscar/?term=${enc(q)}`,nota:"Supermercado online de El Corte Inglés; revisa envío a tu zona."},
};
const SIN_ONLINE={lidl:"Lidl no vende alimentación online: usa la lista en tienda.",aldi:"Aldi no tiene tienda online de alimentación.",gordillo:"Gordillo no tiene tienda online: llévate la lista o pide por teléfono en la tienda.",bio:"Consulta si tu herbolario acepta pedidos por WhatsApp o teléfono: puedes enviarle la lista.",consum:"Consum no reparte en Canarias."};
const qBusqueda=it=>String(it.nombre||"").replace(/\b\d+([.,]\d+)?\s*(kg|g|gr|ml|cl|l|ud|uds)\b/gi,"").replace(/\s+/g," ").trim();
/** Agrupa la lista activa por tienda: [{sid, nombre, items:[{it,key}]}] */
function pedidosDe(L){
const sidLista = L.tipo==="mix" ? null : (L.id==="u" ? (S.plan.superIds||P.supers)[0] : L.id);
const grupos=new Map();
(L.lista||[]).forEach((sec,si)=>(sec.items||[]).forEach((it,ii)=>{
if(it.despensa||it.nofound) return;
const sid=it.tiendaId||sidLista||(SUPERS.find(s=>s.n===it.tienda)||{}).id;
if(!grupos.has(sid)) grupos.set(sid,{sid,nombre:(SUPERS.find(s=>s.id===sid)||{}).n||it.tienda||"Súper",items:[]});
grupos.get(sid).items.push({it,key:`p|${L.id}|${si}.${ii}`});
}));
return [...grupos.values()];
}
const lineaPedido=it=>`${it.por_kg?String(it.cantidad).replace(".",",")+" kg":it.cantidad+" ×"} ${it.nombre}${it.formato&&!normTxt(it.nombre).includes(normTxt(it.formato))?" ("+it.formato+")":""}`;
function promptClaudeChrome(g,o){
return `Entra en ${o.tienda} con mi sesión iniciada (código postal ${CP}) y añade al carrito estos productos. Si alguno no existe o está agotado, añade el equivalente más parecido y más barato, y avísame. NO confirmes ni pagues el pedido: déjalo en el carrito para que lo revise.

${g.items.map(({it})=>"- "+lineaPedido(it)).join("\n")}

Al terminar, dime el total del carrito y qué productos sustituiste.`;
}
function pedidoHTML(L){
const gs=pedidosDe(L);
if(!gs.length) return `<div class="card"><p class="small" style="margin:0">No hay productos para pedir en esta lista.</p></div>`;
return `<p class="small" style="margin:0 0 12px">Abre cada producto en la web del súper, añádelo a tu carrito y márcalo aquí. Luego ve al carrito para elegir entrega y pagar en la web oficial: MojoBasket no guarda contraseñas ni datos de pago.</p>`+
gs.map((g,gi)=>{
const o=ONLINE[g.sid], hechos=g.items.filter(x=>S.checked[x.key]).length, total=g.items.reduce((a,{it})=>a+(+it.precio||0)*(+it.cantidad||1),0);
if(!o) return `<div class="card"><div class="sec-title"><h3>🏪 ${esc(g.nombre)}</h3><span>${eur(total)}</span></div>
<p class="small" style="margin:6px 0 10px">${esc(SIN_ONLINE[g.sid]||"Sin tienda online conocida: usa la lista en tienda.")}</p>
<div class="actions" style="margin:0"><button class="btn" data-copiar="${gi}">📋 Copiar lista</button></div></div>`;
return `<div class="card"><div class="sec-title"><h3>🛍️ ${esc(g.nombre)}</h3><span>${eur(total)}</span></div>
<p class="small" style="margin:4px 0 8px">${esc(o.nota)}</p>
<div class="prog" style="margin:4px 0 10px;width:100%"><i style="width:${Math.round(hechos/g.items.length*100)}%"></i></div>
<p class="small" style="margin:0 0 8px"><b style="color:var(--ink)">${hechos}/${g.items.length}</b> en el carrito</p>
${g.items.map(({it,key})=>{ const url=/\/product\//.test(it.url||"")?it.url:o.buscar(qBusqueda(it));
return `<div class="item${S.checked[key]?" done":""}" data-key="${esc(key)}" role="button"><span class="cb">${S.checked[key]?"✓":""}</span>
<span class="nm"><b>${esc(lineaPedido(it))}</b><small>${S.checked[key]?"en el carrito":"toca para marcar como añadido"}</small></span>
<a class="btn mini ext" href="${esc(url)}" target="_blank" rel="noopener" data-ev="${/\/product\//.test(url)?"ver":"buscar"}" data-cad="${esc(g.sid)}">${/\/product\//.test(url)?"Ver":"Buscar"} ↗</a></div>`; }).join("")}
<div class="actions" style="margin:12px 0 0;flex-wrap:wrap">
<a class="btn" href="${esc(o.carrito)}" target="_blank" rel="noopener" data-ev="carrito" data-cad="${esc(g.sid)}">🛒 Carrito ↗</a>
<button class="btn" data-copiar="${gi}">📋 Copiar</button>
<button class="btn" data-claude="${gi}">🤖 Con Claude</button></div></div>`;
}).join("")+
`<div class="card"><div class="sec-title"><h3>🤖 Pedido asistido</h3></div><p class="small" style="margin:6px 0 0">“Con Claude” copia una instrucción para pegarla en Claude con la extensión <b>Claude en Chrome</b>: Claude abre la web del súper con tu sesión, llena el carrito y se detiene antes de pagar para que lo revises tú.</p></div>`;
}

function recName(id){ const r=(S.plan.recetas||[]).find(r=>r.id===id); return r?r.nombre:id; }
function menuHTML(){
return (S.plan.menu||[]).map(d=>`<div class="card daycard"><h3>${esc(d.dia)}</h3>
${(d.comidas||[]).map(c=>`<button class="meal" data-rec="${esc(c.receta)}"><span class="t">${esc(c.tipo)}</span><span class="n">${esc(recName(c.receta))}</span><span class="go">›</span></button>`).join("")}</div>`).join("");
}
function recetasHTML(){
return (S.plan.recetas||[]).map(r=>`<details class="card rec" id="rec-${esc(r.id)}" ${S.open===r.id?"open":""}><summary>
<h3>${esc(r.nombre)}</h3><div class="meta">${r.patrocinado?`<span class="pat">Patrocinado${r.patrocinado.marca?" · "+esc(r.patrocinado.marca):""}</span>`:""}<span>⏱ ${esc(r.tiempo_min)} min</span><span>🍽 ${esc(r.raciones)} rac.</span>${r.electrodomestico?`<span>🔧 ${esc(r.electrodomestico)}</span>`:""}${(r.etiquetas||[]).map(e=>`<span>${esc(e)}</span>`).join("")}</div>
<span class="sm">Ver receta ›</span></summary>
<div class="lbl">Ingredientes</div><ul>${(r.ingredientes||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
<div class="lbl">Elaboración</div><ol>${(r.pasos||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ol>
${r.churna&&r.churna.nombre?`<div class="churna"><b>🪷 Churna: ${esc(r.churna.nombre)}</b>${esc(r.churna.receta)}${r.churna.efecto?`<div class="small" style="margin-top:4px">${esc(r.churna.efecto)}</div>`:""}</div>`:""}
${r.salsa?`<div class="churna"><b>🌍 Salsa${r.salsa.nombre?": "+esc(r.salsa.nombre):""}</b>${esc(typeof r.salsa==="string"?r.salsa:r.salsa.receta||"")}</div>`:""}
${r.nota_ayurveda?`<div class="nutri"><b>Ayurveda · </b>${esc(r.nota_ayurveda)}</div>`:""}
${r.nota_nutricional?`<div class="nutri"><b>Nutrición · </b>${esc(r.nota_nutricional)}</div>`:""}
</details>`).join("");
}
function listText(){
const L=listaActiva(); let out=`🛒 Lista ${L.tipo==="mix"?"combinada":L.nombre} (${eur(totals(L).total)})\n`;
(L.lista||[]).forEach((sec,si)=>{ const its=(sec.items||[]).map((it,ii)=>({it,k:ck(L,si,ii)})).filter(x=>!x.it.despensa&&!S.checked[x.k]); if(!its.length) return;
out+=`\n${sec.seccion}\n`+its.map(({it})=>`☐ ${it.por_kg?String(it.cantidad).replace(".",",")+" kg ":it.cantidad>1?it.cantidad+"× ":""}${it.nombre}${it.formato?" ("+it.formato+")":""} — ${it.nofound?"no encontrado":(it.estimado?"≈":"")+eur((+it.precio||0)*(+it.cantidad||1))}${it.oferta?" 🏷️":""}`).join("\n")+"\n"; });
return out;
}
function bindResult(){
$("#edit").onclick=()=>{ S.view="wizard"; S.step=0; render(); scrollTo(0,0); };
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });
document.querySelectorAll("[data-lista]").forEach(b=>b.onclick=()=>{ S.plan.activa=b.dataset.lista; S.tab="lista"; save(); const y=scrollY; render(); scrollTo(0,y); });
document.querySelectorAll(".item a.ext").forEach(a=>a.onclick=e=>e.stopPropagation());
document.querySelectorAll(".item[data-key]").forEach(el=>el.onclick=()=>{ const k=el.dataset.key; S.checked[k]=!S.checked[k]; save(); const y=scrollY; render(); scrollTo(0,y); });
document.querySelectorAll("[data-copiar],[data-claude]").forEach(b=>b.onclick=async()=>{
const gs=pedidosDe(listaActiva()); const g=gs[+(b.dataset.copiar??b.dataset.claude)]; if(!g) return;
const txt=b.dataset.claude!=null?promptClaudeChrome(g,ONLINE[g.sid]):`🛒 Pedido ${g.nombre}\n`+g.items.map(({it})=>"☐ "+lineaPedido(it)).join("\n");
ev(b.dataset.claude!=null?"claude_chrome":"copiar",{cadena:g.sid}); try{ await navigator.clipboard.writeText(txt); toast(b.dataset.claude!=null?"Instrucción copiada: pégala en Claude en Chrome":"Lista copiada"); }catch(e){ toast("No se pudo copiar"); }
});
document.querySelectorAll("[data-optx],[data-optm],[data-optt],[data-optmodo]").forEach(b=>b.onclick=()=>{
const p=S.plan; p.optParams={...OPT_DEF,...(p.optParams||{})};
if(!p.opt.dist){ p.opt.dist=distanciasCadenas(p.opt.sids); p.opt.pos=posUsuario(); }
if(b.dataset.optx!=null) p.optParams.extra=+b.dataset.optx; else if(b.dataset.optm!=null) p.optParams.max=+b.dataset.optm; else if(b.dataset.optt!=null) p.optParams.tarifa=+b.dataset.optt; else p.optParams.modo=b.dataset.optmodo;
construirMixta(p); Object.keys(S.checked).forEach(k=>{ if(k.startsWith("mix|")||k.startsWith("p|mix|")) delete S.checked[k]; });
save(); const y=scrollY; render(); scrollTo(0,y); toast("Cesta recalculada");
});
const c=$("#copy"); if(c) c.onclick=async()=>{ try{ await navigator.clipboard.writeText(listText()); toast("Lista copiada"); }catch(e){ toast("No se pudo copiar"); } };
const u=$("#uncheck"); if(u) u.onclick=()=>{ const L=listaActiva(); Object.keys(S.checked).forEach(k=>{ if(k.startsWith(L.id+"|")) delete S.checked[k]; }); save(); render(); };
document.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>{ S.tab="recetas"; S.open=b.dataset.rec; render(); const el=document.getElementById("rec-"+b.dataset.rec); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); });
}

render();
})();
